<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Irrigation Firmware Installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@latest/dist/web/install-button.js?module"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f8;
      color: #1f2933;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 520px);
      background: #ffffff;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
      line-height: 1.2;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    select {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid #b8c2cc;
      border-radius: 6px;
      font: inherit;
      background: #ffffff;
      color: #1f2933;
    }

    .installer {
      margin-top: 20px;
    }

    p {
      margin: 16px 0 0;
      color: #52606d;
      line-height: 1.45;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        background: #111827;
        color: #f3f4f6;
      }

      main {
        background: #1f2937;
        border-color: #374151;
      }

      select {
        background: #111827;
        color: #f3f4f6;
        border-color: #4b5563;
      }

      p {
        color: #cbd5e1;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>ESP32 Irrigation Firmware Installer</h1>

    <label for="board">Board</label>
    <select id="board">
      <option value="esp32-dev/manifest.json">ESP32 Dev Module</option>
      <option value="esp32-s3-devkitc-1/manifest.json">ESP32-S3 DevKitC-1</option>
    </select>

    <div class="installer">
      <esp-web-install-button id="installer"></esp-web-install-button>
    </div>

    <p>Use Chrome or Edge. Connect the board by USB, choose the matching board, then install.</p>
  </main>

  <script>
    const board = document.getElementById("board");
    const installer = document.getElementById("installer");

    function updateManifest() {
      installer.setAttribute("manifest", board.value);
    }

    board.addEventListener("change", updateManifest);
    updateManifest();
  </script>
</body>
</html>
